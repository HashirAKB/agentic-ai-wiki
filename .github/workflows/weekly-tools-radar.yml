name: Weekly tools radar

on:
  schedule:
    - cron: "13 2 * * 6" # Saturdays 07:43 IST
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: wiki-writes
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set git identity
        run: |
          git config user.name "claude-wiki-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Read .github/claude/weekly-tools-radar.md and follow it exactly."
          claude_args: >-
            --max-turns 80
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(date:*),Bash(mkdir:*)"

      - name: Commit and push anything left uncommitted
        if: always()
        run: |
          git status --short
          git add -A -- . ':!.github'
          if git diff --cached --quiet; then
            echo "Nothing left to commit."
          else
            git commit -m "radar: $(date -u +%F) (auto-commit)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          git log --oneline -3
